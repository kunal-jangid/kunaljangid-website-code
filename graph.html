<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunal Jangid // Chaotic Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-color: #EEE9DF; --text-color: #2B323F; --border-color: #111111; --accent-color: #C2441C; }
        body { background-color: var(--bg-color); color: var(--text-color); margin: 0; overflow: hidden; font-family: sans-serif; }
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }
        #node-container { position: relative; width: 5000px; height: 5000px; z-index: 10; cursor: grab; transform-origin: 0 0; }
        #node-container:active { cursor: grabbing; }
        
        .node-card { 
            position: absolute; 
            padding: 1.25rem; 
            border: 1px solid var(--border-color); 
            background: var(--bg-color); 
            width: 300px; 
            user-select: none; 
            box-shadow: 4px 4px 0px var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            /* Removed transition: transform to ensure perfect canvas sync */
            transition: box-shadow 0.3s ease;
        }
        
        .node-card.dragging { 
            box-shadow: 12px 12px 0px var(--border-color); 
            opacity: 0.95; 
            filter: url(#distort);
            z-index: 1000 !important;
        }

        .tag {
            font-size: 9px;
            font-family: monospace;
            padding: 2px 6px;
            border: 0.5px solid var(--border-color);
            opacity: 0.7;
            border-radius: 2px;
        }

        /* Noise Overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.05;
            z-index: 100;
            background: url('data:image/svg+xml;fragment-svg,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
        }

        /* Photography Cluster - Blur Reveal */
        .node-photo {
            position: absolute;
            width: 200px;
            height: 200px;
            padding: 6px;
            background: white;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            cursor: grab;
            user-select: none;
            transition: box-shadow 0.3s ease;
        }
        .node-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(1.1);
            pointer-events: none;
            will-change: transform;
        }
        .node-photo:hover img, .node-photo.dragging img {
            transform: scale(1);
        }
        .node-photo.dragging {
            box-shadow: 12px 12px 30px rgba(0,0,0,0.2);
            z-index: 1000 !important;
        }

        /* Music Cluster - Vinyl Records */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .node-music {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #000;
            border: 4px solid #111;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: grab;
        }

        .vinyl-inner {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            animation: spin 10s linear infinite;
            position: relative;
        }

        /* Concentric Grooves */
        .vinyl-inner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                rgba(0,0,0,0) 0,
                rgba(0,0,0,0.1) 2px,
                rgba(0,0,0,0) 4px
            );
            pointer-events: none;
        }

        .music-info-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            border-radius: 50%;
            pointer-events: none;
        }

        .node-music:hover .music-info-overlay {
            opacity: 1;
        }

        .node-music:hover .vinyl-inner {
            animation-play-state: paused;
        }

        /* The following ensures dragging behavior is consistent */
        .node-music.dragging {
            box-shadow: 12px 12px 30px rgba(0,0,0,0.2);
            z-index: 1000 !important;
            cursor: grabbing;
        }

        @media (min-width: 768px) {
            body,
            a,
            button,
            .cursor-pointer {
                cursor: none !important;
            }
        }

        .custom-cursor {
            width: 30px;
            height: 30px;
            background: var(--accent-color);
            border-radius: 100%;
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            transition: width 0.5s, height 0.5s, background-color 0.5s, opacity 1.0s;
        }

        @media (max-width: 768px) {
            .node-card {
                width: 240px;
                padding: 1rem;
            }
            .node-card h3 {
                font-size: 0.875rem;
            }
            .node-card p {
                font-size: 0.625rem;
            }
            .node-photo {
                width: 160px;
                height: 160px;
            }
            .node-music {
                width: 140px;
                height: 140px;
            }
            #mobile-nav button {
                color: var(--text-color);
                background: transparent;
            }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <!-- Navigation Overlay -->
    <div style="position: fixed; top: 20px; left: 20px; z-index: 110;">
        <a href="index.html" class="px-4 py-2 text-xs font-mono uppercase tracking-widest border border-current rounded shadow-sm bg-transparent transition-all duration-300 hover:bg-[var(--text-color)] hover:text-[var(--bg-color)] flex items-center gap-2" style="color: var(--text-color); border-color: var(--text-color); text-decoration: none;">
            ← Go Back
        </a>
    </div>
    <canvas id="canvas-bg"></canvas>
    <div id="viewport" style="width: 100vw; height: 100vh; overflow: hidden; position: relative; touch-action: none;">
        <div id="node-container"></div>
    </div>

    <!-- UI Overlay -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 100;">
        <button id="theme-toggle" class="px-4 py-2 text-xs font-mono uppercase tracking-widest border border-current rounded shadow-sm bg-transparent transition-all duration-300 hover:scale-105 active:scale-95" style="color: var(--text-color); border-color: var(--text-color);">
            Toggle Theme
        </button>
    </div>

    <div id="mobile-nav" class="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] flex gap-2 p-2 rounded-full border border-[var(--border-color)] bg-[var(--bg-color)]/80 backdrop-blur-md shadow-2xl">
        <button onclick="smoothNavigate(2500, 2500, 0.8)" class="px-4 py-2 text-[10px] font-bold uppercase tracking-tighter border border-[var(--border-color)] rounded-full hover:bg-[var(--text-color)] hover:text-[var(--bg-color)] transition-all">Projects</button>
        <button onclick="smoothNavigate(2000, 4000, 0.8)" class="px-4 py-2 text-[10px] font-bold uppercase tracking-tighter border border-[var(--border-color)] rounded-full hover:bg-[var(--text-color)] hover:text-[var(--bg-color)] transition-all">Music</button>
        <button onclick="smoothNavigate(4000, 2000, 0.8)" class="px-4 py-2 text-[10px] font-bold uppercase tracking-tighter border border-[var(--border-color)] rounded-full hover:bg-[var(--text-color)] hover:text-[var(--bg-color)] transition-all">Photos</button>
    </div>

    <!-- SVG Filter for Fluid Distortion -->
    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="distort">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" result="warp" />
                <feDisplacementMap in="SourceGraphic" in2="warp" scale="20" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>
    <script src="photography/photos.js"></script>
    <script src="graph.js"></script>
    <script src="v2-motion.js"></script>
</body>
</html>
